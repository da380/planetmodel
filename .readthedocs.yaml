version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # Doxygen builds the C++ reference beside the pages (docs/source/conf.py).
  apt_packages:
    - doxygen
  jobs:
    post_create_environment:
      - pip install poetry
    # The base install plus the docs group: numpy, scipy, ducc0, finufft,
    # sphinx and the theme.  The optional extras (gmsh, PyMFEM, matplotlib) are mocked
    # by docs/source/conf.py, not installed.
    post_install:
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH poetry install --with docs

sphinx:
  configuration: docs/source/conf.py
