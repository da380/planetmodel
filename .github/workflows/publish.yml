name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      # The release tag and the version in pyproject.toml are set by hand, in
      # two different places (see CONTRIBUTING.md).  If they disagree, PyPI
      # accepts whatever pyproject says and the tag then points at something
      # that was never published under that name.  PyPI does not allow a
      # version to be re-uploaded, so this is caught here or not at all.
      - name: Check the tag matches the package version
        run: |
          version=$(poetry version --short)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' does not match pyproject.toml version '${version}'."
            exit 1
          fi
          echo "Tag and version agree on ${version}."

      # `poetry build` reads pyproject.toml and the source tree; it does not
      # need the dependencies installed, so nothing optional is on the
      # publish path.
      - name: Build package
        run: poetry build

      # The token is a PyPI API token scoped to this project, stored as the
      # repository secret PYPI_API_TOKEN.
      - name: Publish package to PyPI
        run: poetry publish --username __token__ --password ${{ secrets.PYPI_API_TOKEN }}
