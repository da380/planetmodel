name: Registry check

# Every shipped data set fetched from its host into an empty cache, its
# sha256 checked, read, and held to its contract (the tests marked
# `network`).  A file changed upstream, a host moved or a certificate
# lapsed fails here, before a user meets it.  An entry whose host
# refuses GitHub's runners (Earth2014's) is skipped here and checked by
# running `pytest -m network` by hand.  By hand from the Actions tab,
# and on the first of every month at an odd minute (scheduled runs start
# late at the top of the hour; GitHub turns schedules off after 60 days
# without activity in the repository, and a click turns them on).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

jobs:
  registry:
    name: Fetch and read every data set
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create false

      # netcdf for the gridded entries, maps (with matplotlib) for the
      # published-models tutorial, which fetches them too
      - name: Install dependencies
        run: poetry install --with dev --extras "netcdf maps"

      - name: Fetch, check and read every entry
        env:
          PLANETMODEL_DATA: ${{ runner.temp }}/planetmodel-data
        run: poetry run pytest -m network -v
