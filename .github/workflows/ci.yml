name: CI

# Pull requests to main, and main itself once they merge: a branch is
# tested once, on its pull request, rather than on every push to it and
# again there.  Pushes to develop run nothing here; the pre-push hook runs
# the fast suite locally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The meshing and MFEM tests need gmsh and PyMFEM, which are heavy; the
  # `meshing` job below runs them on Linux only, and `full-tests` runs the
  # whole suite on demand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are pointless; pushes to main are kept so
  # that it has a complete history of green and red commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The hooks of .pre-commit-config.yaml, so that CI and the local hooks can
  # never disagree about what "clean" means.  Runs once, on Linux: nothing
  # here is platform-dependent.
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run hooks
        env:
          # `no-commit-to-branch` guards local commits; on a CI checkout of main
          # it would fail every run.  `pytest` is a pre-push hook and is
          # covered by the test job below.
          SKIP: no-commit-to-branch,pytest
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  # The fast suite: the dependencies, plus the `plot`, `netcdf` and `maps` extras
  # so that the plotting, model-file and map tests run rather than skip.  Every
  # platform and every supported Python.
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is worth knowing about on the others too.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --with dev --extras "plot netcdf maps"

      - name: Test with pytest
        # The default selection is the fast suite (pyproject's addopts).
        run: poetry run pytest --cov=planetmodel --cov-report=term-missing

      - name: Build package
        run: poetry build

  # The fast suite again under the oldest numpy, scipy and ducc0 that
  # pyproject.toml admits, installed over the locked environment, so that
  # the lower bounds stay true.  Linux and one Python: the question is the
  # libraries' API, not the platform.  The versions here are the floors of
  # `dependencies` in pyproject.toml and move with them.  The newest
  # versions the pins admit are newest.yml's.
  lowest-pins:
    name: Test (lowest numpy, scipy and ducc0)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --with dev --extras "plot netcdf"

      - name: Step numpy, scipy and ducc0 down to their floors
        run: pip install "numpy==2.0.*" "scipy==1.15.*" "ducc0==0.41.*"

      - name: Test with pytest
        run: |
          python -c "import numpy, scipy, ducc0; print(numpy.__version__, scipy.__version__, ducc0.__version__)"
          poetry run pytest

  # The gmsh unit geometries and the MFEM exports, which the fast suite
  # deselects.  Linux only: gmsh and PyMFEM ship Linux wheels, and the
  # meshes are a few elements across.
  meshing:
    name: Meshing and MFEM (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --with dev --extras "plot meshing mfem netcdf"

      # gmsh's wheel needs the X and OpenGL libraries even headless.
      - name: Install gmsh's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Test the meshing and export suites
        run: poetry run pytest -m "gmsh or mfem"

  # The C++ library in cpp/: the fixtures written by the Python first, then
  # the library's own tests and its consumer builds, under the two
  # compilers its codes use, with warnings as errors.  The fixtures are
  # required here, so a test that would skip for want of one fails.
  cpp:
    name: C++ library (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++-14
          - compiler: clang++-18

    steps:
      - uses: actions/checkout@v4

      # netCDF-C for the model file; gmsh's wheel needs the X and OpenGL
      # libraries even headless, for the meshes behind the manifests.
      - name: Install netCDF-C, the compilers and gmsh's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev g++-14 clang-18 \
            libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create false

      # plot and maps for the kernel tutorial, run on the C++ example's
      # file below.
      - name: Install dependencies
        run: poetry install --with dev --extras "netcdf meshing mfem plot maps"

      - name: Write the fixtures
        run: poetry run python cpp/tests/make_fixtures.py

      - name: Configure
        run: >
          cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DPLANETMODEL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/cpp -j 4

      - name: Test
        env:
          PLANETMODEL_REQUIRE_FIXTURES: "1"
        run: ctest --test-dir build/cpp --output-on-failure -j 4

      # What the C++ writer wrote, validated and read by the Python.
      - name: The Python reads what the C++ wrote
        env:
          PLANETMODEL_CPP_WRITTEN: build/cpp/tests/written
        run: poetry run pytest -q tests/test_cpp_written.py

      # The example reader, on a file the Python wrote.
      - name: The example reads a Python model file
        run: build/cpp/examples/planetmodel_read_model cpp/tests/fixtures/model_stacked.nc

      # The kernel the example wrote, drawn by tutorial 15, which checks it
      # against the Python's own at every node.
      - name: The kernel tutorial reads the C++ example's kernel
        env:
          MPLBACKEND: Agg
        run: poetry run python examples/tutorials/15_kernels.py build/cpp/tests/written/kernel.nc

      # The library is fetched from the repository at a tag, never from
      # PyPI, so the Python package leaves it out.
      - name: The package leaves cpp/ out
        if: matrix.compiler == 'g++-14'
        run: |
          poetry build -o dist
          if tar -tzf dist/*.tar.gz | grep -q '/cpp/'; then
            echo "the sdist contains cpp/"; exit 1
          fi
          if unzip -l dist/*.whl | grep -q ' cpp/'; then
            echo "the wheel contains cpp/"; exit 1
          fi

  # The C++ reference, by the Doxyfile Read the Docs builds it by: every
  # warning, an undocumented public name among them, fails the job, and the
  # warnings are repeated as annotations so that the checks view shows them.
  cpp-docs:
    name: C++ reference (Doxygen)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          doxygen --version

      - name: Build the reference
        working-directory: cpp
        env:
          PLANETMODEL_DOCS_OUTPUT: ${{ github.workspace }}/build/docs
          PLANETMODEL_VERSION: ci
        run: |
          # Doxygen makes the last directory of its output, not the ones above
          mkdir -p "$PLANETMODEL_DOCS_OUTPUT"
          set +e
          doxygen docs/Doxyfile 2> doxygen.log
          status=$?
          set -e
          cat doxygen.log
          if [ "$status" -ne 0 ]; then
            head -n 30 doxygen.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi

  # Everything off the network, including whatever is marked slow.  Run by
  # hand: Actions -> CI -> Run workflow.  Worth doing before a release.  The
  # tests marked `network` fetch published data sets and run on their own.
  full-tests:
    name: Full test suite (including slow)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --with dev --extras "plot meshing mfem netcdf"

      - name: Install gmsh's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Test with pytest
        run: poetry run pytest -m "not network" --cov=planetmodel --cov-report=term-missing
