[project]
name = "planetmodel"
version = "1.3.2"
description = "Spherically layered planetary models: reference bodies, fields, mappings and meshes"
keywords = ["geophysics", "seismology", "planetary models", "PREM", "spectral elements", "meshing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
authors = [
    {name = "David Al-Attar",email = "da380@cam.ac.uk"}
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.15,<2",
    "ducc0>=0.41,<1",
]

[project.urls]
Homepage = "https://github.com/da380/planetmodel"
Repository = "https://github.com/da380/planetmodel"

[project.optional-dependencies]
meshing = ["gmsh>=4.13"]
mfem = ["mfem>=4.8"]
netcdf = ["netCDF4>=1.7"]
plot = ["matplotlib>=3.11,<4"]
maps = ["matplotlib>=3.11,<4", "cartopy>=0.24,<1"]
notebook = ["ipykernel>=6.29"]

[dependency-groups]
dev = [
    "pytest>=9",
    # opens model files in the tests as CF tools do
    "xarray>=2024.10",
    "ruff>=0.6",
    "pre-commit (>=4)",
    "pytest-cov (>=6)",
]
docs = [
    # The lower bound: the apidoc template in docs/apidoc_templates is
    # named package.rst.jinja, the name Sphinx looks for from 7.4
    # onwards.  The upper: Sphinx 9's autodoc evaluates PEP 695 `type`
    # aliases, which fails on the names imported under TYPE_CHECKING.
    "sphinx>=7.4,<9",
    "furo>=2024.8",
]

[tool.poetry]
packages = [{include = "planetmodel", from = "src"}]

# The docs group serves Read the Docs and local documentation builds
# (`poetry install --with docs`); a plain install leaves it out.
[tool.poetry.group.docs]
optional = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = [".*", "build", "dist"]
# The fast suite is the default: it needs the dependencies alone, and the
# `plot`, `netcdf` and `maps` extras where installed.  `-m "not slow and not
# network"` adds the gmsh unit geometries and the MFEM exports, `-m "not
# network"` everything off the network, and `-m network` the registry check,
# which fetches every data set.
addopts = "-m 'not gmsh and not mfem and not slow and not network'"
# netCDF4 1.7.4 sets an array's shape when writing a variable of two or
# more dimensions, which numpy 2.5 deprecates; nothing of ours to change.
filterwarnings = [
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
markers = [
    "slow: long-running tests (minutes); deselect with -m 'not slow'",
    "gmsh: requires the optional gmsh dependency (planetmodel[meshing])",
    "mfem: requires PyMFEM (planetmodel[mfem])",
    "netcdf: requires netCDF4 (planetmodel[netcdf])",
    "maps: requires cartopy (planetmodel[maps])",
    "network: fetches published data sets from their hosts; run with -m network",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# Deliberate house style, not defects:
#   E741  `l` is the spherical-harmonic degree and `I` an integral -- the
#         standard symbols in this field, used consistently throughout.
#   E702  paired assignments to symmetric matrix entries are written on one
#         line so the symmetry is visible.
#   E731  short lambdas bound to names read as the mathematical definitions
#         they are (fitters, coefficient functions).
ignore = ["E741", "E702", "E731"]
